# log日志文件配置

dict_log_config:
  # 日志收集器-配置
  logger_handler:
    level : DEBUG  # 输出日志级别

  # 控制台日志处理器-配置
  console_handler :
    level : DEBUG  # 输出日志级别 (DEBUG、INFO)
    formatter : "[时间:%(asctime)s][线程:%(threadName)s:%(thread)d][路径:%(filename)s:%(lineno)d][级别:%(levelname)s:%(levelno)s][描述信息:%(message)s][task_id:%(name)s]"  # 控制台输出格式
    color_log :  # 日志级别增加颜色展示
    DEBUG : white
    INFO : green
    WARING : yellow
    ERROR : red
    CRITICAL: bold_red

  # 日志文件处理器-配置
  file_handler :
    level : INFO  # 输出日志级别
    file_format : "[时间:%(asctime)s][线程:%(threadName)s:%(thread)d][路径:%(filename)s:%(lineno)d][级别:%(levelname)s:%(levelno)s][描述信息:%(message)s]"  # 日志文件输出格式
    log_file_name : running_log.log
    max_bytes : 6  # 日志文件的大小，单位:M
    backup_count : 10 # 轮转保存日志的文件数量
    log_encoding : utf-8  # 输出日志编码格式